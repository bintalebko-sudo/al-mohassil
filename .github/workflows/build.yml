name: بناء ملف APK لنظام Android

on:
  push:
    branches: [ "رئيسي" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: مستودع التحقق
      uses: actions/checkout@v4

    - name: التثبيت JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: إعداد Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: تثبيت كوردوفا
      run: npm install -g cordova

    - name: إنشاء مشروع Android وإعداد Cordova
      run: |
        cordova telemetry off
        cordova create myApp com.bintaleb.almohassil AlMohassil
        cd myApp
        rm -rf www/*
              - body><div id="app"></div><script src="index.js"></script></body></html>' > www/index.html
        fi

    - name: إضافة منصة كوردوفا لنظام أندرويد
      run: |
        cd myApp
        cordova platform add android@11.0.0

    - name: بناء مشروع كوردوفا
      run: |
        cd myApp
        cordova build android --debug

    - name: تحميل ملف APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
