      - name: إنشاء مشروع Cordova يفترض Android
        run: |
          cordova telemetry off
          cordova create myApp com.bintaleb.almohassil AlMohassil
          cd myApp
          rm -rf www/*
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>المحصل</title></head><body><div id="root"></div><script src="index.js"></script></body></html>' > www/index.html
          if [ -f ../App.tsx ]; then
            cp ../App.tsx www/index.js
          fi
